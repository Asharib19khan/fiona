# Financing catalogue (B14): the options Fiona's financing matcher (Y10, Yahya) can recommend.
# Schema agreed with fiona-79 on 13 Oct 2026. Human-readable notes: rulebook/docs/B14_Financing_Catalogue.md.
#
# Honesty rules for this file
#   - Every option lists source_ids and an as_of date. `verification` says how good the source is:
#       primary              read on the issuer's or regulator's own page
#       secondary            reputable secondary report, not yet checked against the primary
#       assumption           no public source gives the figure; a labelled expert-judgement range
#                            (Fiona T-DEC-HURDLE-01) that a term sheet must replace
#       unverified           placeholder; the matcher must not rank on it
#   - Field-level `verification` overrides the option-level one.
#   - A cost no source supports is null. The matcher then reports "insufficient data: need a
#     quote or term sheet" for that option, never a guess.
#   - Government and central-bank schemes are real programmes; terms change and participating
#     banks decide eligibility. Product names of private lenders are never used; any example
#     product would be labelled `illustrative: true`.
#   - Units: money in minor units, rates in basis points (FORMATS.md). Ranges are {low, high}.
#
# Conditions use the grammar in finance_rules.yaml. `input:` paths the matcher must supply:
#   request.purpose, request.amount_minor, request.tenor_months, request.is_new_borrower_of_bank,
#   profile.owner_age_years, profile.legal_form, profile.size_tier, profile.years_operating,
#   profile.has_b2b_receivables, profile.country.

schema_version: 1
catalogue_version: "1.0.0"
as_of: "2026-10-13"
owner: abdullah (fiona-fa)

market:
  reference_lending_rate:
    PK: {name: "6-month KIBOR (offer)", value_bp: 1242, as_of: "2026-10-12", source_id: SRC-SBP-KIBOR-20261012, verification: primary}
    PK_3M: {name: "3-month KIBOR (offer)", value_bp: 1201, as_of: "2026-10-12", source_id: SRC-SBP-KIBOR-20261012, verification: primary}
    CN: {name: "1-year Loan Prime Rate", value_bp: 300, as_of: "2026-09-21", source_id: SRC-CN-LPR, verification: secondary, note: "Unchanged since 20 May 2025 per secondary reporting; confirm on pbc.gov.cn before the demo."}

ranking:
  default_order: [effective_annual_cost_mid, time_to_funds_days_mid, dilution]
  rule: "Ineligible options (hard rule failed) are listed last with the failed rule. Options with null cost are ranked after costed ones and say what quote is needed. DSCR after borrowing must meet T-SOL-DSCR-01 (base) and T-SOL-DSCR-02 (downside) for any debt option to be 'recommended'; otherwise it is 'possible at a smaller size' with decision.max_debt_at_min_dscr."
  flexibility_meaning: {high: "draw and repay at will", medium: "fixed schedule with prepayment allowed", low: "fixed schedule, penalties or covenants restrict changes"}

