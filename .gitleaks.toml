# Secret scanning (R16): gitleaks' default rules, minus generated lockfiles and binary documents.
title = "Fiona gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Lockfiles and binary documents carry hashes, not secrets"
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)uv\.lock$''',
  '''\.pdf$''',
  # Fixture manifests list SHA-256 file hashes ("answer_key.json": "<64 hex>"), which the
  # generic-api-key rule misreads as keys. Path-scoped so a real 64-hex key elsewhere is still caught.
  '''^data/fixtures/[^/]+/manifest\.json$''',
  # Web application unit tests carrying synthetic mock tokens and idempotency test headers
  '''^apps/web/test/live-bff-auth\.test\.ts$''',
  '''^apps/web/test/proposal-intake\.test\.ts$''',
]

[[allowlists]]
description = "Supabase publishable key: public by design (shipped to every browser), protected by RLS"
paths = ['''^scripts/live\.env$''']
regexes = ['''sb_publishable_[A-Za-z0-9_-]+''']
condition = "AND"

