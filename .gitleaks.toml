# Secret scanning (R16): gitleaks' default rules, minus generated lockfiles and binary documents.
title = "Fiona gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Lockfiles and binary documents carry hashes, not secrets"
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)uv\.lock$''',
  '''\.pdf$''',
]
