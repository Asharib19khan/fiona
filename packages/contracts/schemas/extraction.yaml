# Bill extraction: model-only decimal strings are normalized into integer minor units in code.
$defs:
  SourceSpan:
    type: object
    additionalProperties: false
    required: [page, quote]
    properties:
      page: { type: integer, minimum: 1 }
      quote: { type: string, minLength: 1, maxLength: 500 }
      bbox:
        type: [array, "null"]
        minItems: 4
        maxItems: 4
        items: { type: number, minimum: 0, maximum: 1 }
      verified_in_text: { type: [boolean, "null"] }

  SourcedText:
    type: object
    additionalProperties: false
    required: [value, source, confidence]
    properties:
      value: { type: [string, "null"], maxLength: 500 }
      source: { anyOf: [{ $ref: "#/$defs/SourceSpan" }, { type: "null" }] }
      confidence: { type: string, enum: [low, medium, high] }

  SourcedDate:
    type: object
    additionalProperties: false
    required: [value, source, confidence]
    properties:
      value: { anyOf: [{ $ref: "#/$defs/Date" }, { type: "null" }] }
      source: { anyOf: [{ $ref: "#/$defs/SourceSpan" }, { type: "null" }] }
      confidence: { type: string, enum: [low, medium, high] }

  ModelMoney:
    description: Raw model output; never use for accounting before normalization and checks.
    type: object
    additionalProperties: false
    required: [amount, currency, source, confidence]
    properties:
      amount: { type: [string, "null"], pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
      currency: { anyOf: [{ $ref: "#/$defs/Currency" }, { type: "null" }] }
      source: { anyOf: [{ $ref: "#/$defs/SourceSpan" }, { type: "null" }] }
      confidence: { type: string, enum: [low, medium, high] }

  SourcedMoney:
    type: object
    additionalProperties: false
    required: [value, source, confidence]
    properties:
      value: { anyOf: [{ $ref: "#/$defs/Money" }, { type: "null" }] }
      source: { anyOf: [{ $ref: "#/$defs/SourceSpan" }, { type: "null" }] }
      confidence: { type: string, enum: [low, medium, high] }

  ExtractedBankAccount:
    type: object
    additionalProperties: false
    required: [holder, bank, account_number, iban]
    properties:
      holder: { type: [string, "null"], maxLength: 200 }
      bank: { type: [string, "null"], maxLength: 200 }
      account_number: { type: [string, "null"], maxLength: 100 }
      iban: { type: [string, "null"], maxLength: 64 }

  SourcedBankAccount:
    type: object
    additionalProperties: false
    required: [value, source, confidence]
    properties:
      value: { anyOf: [{ $ref: "#/$defs/ExtractedBankAccount" }, { type: "null" }] }
      source: { anyOf: [{ $ref: "#/$defs/SourceSpan" }, { type: "null" }] }
      confidence: { type: string, enum: [low, medium, high] }

  ModelBillLine:
    type: object
    additionalProperties: false
    required: [description, quantity, unit_price, tax_rate, line_total, source]
    properties:
      description: { type: string, minLength: 1, maxLength: 500 }
      quantity: { type: [string, "null"], pattern: "^[0-9]+(?:\\.[0-9]+)?$" }
      unit_price: { $ref: "#/$defs/ModelMoney" }
      tax_rate: { type: [string, "null"], maxLength: 40 }
      line_total: { $ref: "#/$defs/ModelMoney" }
      source: { $ref: "#/$defs/SourceSpan" }

  ExtractedBillLine:
    type: object
    additionalProperties: false
    required: [description, quantity, unit_price, tax_rate, line_total, source]
    properties:
      description: { type: string, minLength: 1, maxLength: 500 }
      quantity: { type: [string, "null"], pattern: "^[0-9]+(?:\\.[0-9]+)?$" }
      unit_price: { $ref: "#/$defs/SourcedMoney" }
      tax_rate: { $ref: "#/$defs/SourcedText" }
      line_total: { $ref: "#/$defs/SourcedMoney" }
      source: { $ref: "#/$defs/SourceSpan" }

  ModelExtractedBill:
    type: object
    additionalProperties: false
    required: [supplier_name, supplier_tax_id, supplier_address, invoice_number, issue_date, due_date, currency, purchase_order_ref, lines, subtotal, tax_total, total, bank_account]
    properties:
      supplier_name: { $ref: "#/$defs/SourcedText" }
      supplier_tax_id: { $ref: "#/$defs/SourcedText" }
      supplier_address: { $ref: "#/$defs/SourcedText" }
      invoice_number: { $ref: "#/$defs/SourcedText" }
      issue_date: { $ref: "#/$defs/SourcedDate" }
      due_date: { $ref: "#/$defs/SourcedDate" }
      currency: { $ref: "#/$defs/SourcedText" }
      purchase_order_ref: { $ref: "#/$defs/SourcedText" }
      lines: { type: array, maxItems: 500, items: { $ref: "#/$defs/ModelBillLine" } }
      subtotal: { $ref: "#/$defs/ModelMoney" }
      tax_total: { $ref: "#/$defs/ModelMoney" }
      total: { $ref: "#/$defs/ModelMoney" }
      bank_account: { $ref: "#/$defs/SourcedBankAccount" }

  ModelBillExtraction:
    type: object
    additionalProperties: false
    required: [bill, embedded_instructions, low_confidence_fields, unreadable_regions]
    properties:
      bill: { $ref: "#/$defs/ModelExtractedBill" }
      embedded_instructions:
        type: array
        maxItems: 100
        items:
          type: object
          additionalProperties: false
          required: [quote, page]
          properties:
            quote: { type: string, minLength: 1, maxLength: 500 }
            page: { type: integer, minimum: 1 }
      low_confidence_fields: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 100 } }
      unreadable_regions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 300 } }

  BillExtraction:
    type: object
    additionalProperties: false
    required: [api_version, document, bill, checks, flags, meta]
    properties:
      api_version: { $ref: "#/$defs/ApiVersion" }
      document:
        type: object
        additionalProperties: false
        required: [id, sha256, media_type, pages]
        properties:
          id: { $ref: "#/$defs/DocumentId" }
          sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
          media_type: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp] }
          pages: { type: integer, minimum: 1 }
      bill:
        type: object
        additionalProperties: false
        required: [supplier_name, supplier_tax_id, supplier_address, invoice_number, issue_date, due_date, currency, purchase_order_ref, lines, subtotal, tax_total, total, bank_account]
        properties:
          supplier_name: { $ref: "#/$defs/SourcedText" }
          supplier_tax_id: { $ref: "#/$defs/SourcedText" }
          supplier_address: { $ref: "#/$defs/SourcedText" }
          invoice_number: { $ref: "#/$defs/SourcedText" }
          issue_date: { $ref: "#/$defs/SourcedDate" }
          due_date: { $ref: "#/$defs/SourcedDate" }
          currency: { $ref: "#/$defs/SourcedText" }
          purchase_order_ref: { $ref: "#/$defs/SourcedText" }
          lines: { type: array, maxItems: 500, items: { $ref: "#/$defs/ExtractedBillLine" } }
          subtotal: { $ref: "#/$defs/SourcedMoney" }
          tax_total: { $ref: "#/$defs/SourcedMoney" }
          total: { $ref: "#/$defs/SourcedMoney" }
          bank_account: { $ref: "#/$defs/SourcedBankAccount" }
      checks:
        type: object
        additionalProperties: false
        required: [arithmetic_mismatch, difference, currency_mismatch]
        properties:
          arithmetic_mismatch: { type: boolean }
          difference: { anyOf: [{ $ref: "#/$defs/Money" }, { type: "null" }] }
          currency_mismatch: { type: boolean }
      flags:
        type: object
        additionalProperties: false
        required: [embedded_instructions, low_confidence_fields, unreadable_regions]
        properties:
          embedded_instructions:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [quote, page]
              properties:
                quote: { type: string, minLength: 1, maxLength: 500 }
                page: { type: integer, minimum: 1 }
          low_confidence_fields: { type: array, uniqueItems: true, items: { type: string } }
          unreadable_regions: { type: array, items: { type: string } }
      meta: { $ref: "#/$defs/Meta" }
