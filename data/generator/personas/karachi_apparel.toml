# Persona: Karachi apparel retailer. SYNTHETIC: every name, number and account is invented.
#
# DRAFT      = a policy value that belongs to Abdullah's rulebook; replace it when B-tasks land.
# ASSUMPTION = a fact we chose because no source document fixes it (listed in FORMATS.md).
# Mandates come from rulebook/mandates.yaml and scenario IDs from rulebook/scenarios.yaml.

[tenant]
id = "ten_karachi_apparel"
name = "Karachi Apparel Co. (synthetic)"
country = "PK"
currency = "PKR"
minor_unit = 2
framework = "IFRS_SMES"
fiscal_year_start_month = 7  # ASSUMPTION: Pakistan's tax year starts on 1 July
timezone = "Asia/Karachi"
utc_offset_hours = 5
as_of = "2026-10-22"  # ASSUMPTION: demo "as of" date used by the Blueprint examples
holdout_days = 91  # 13 weeks simulated past as_of, published separately for backtests

[policies]
cash_buffer_minor = 200_000_000  # from rulebook/mandates.yaml tenant_policies

[country_pack_draft]
gst_rate_bp = 1800  # ASSUMPTION: 18 % standard sales tax on goods
prices_include_gst = true  # ASSUMPTION: shelf prices include GST
tax_id_type = "NTN"
tax_id_pattern = "^[0-9]{7}-[0-9]$"

[bank]
iban_bank_code = "SYNA"  # not a real bank code
name = "Operating account"
opening_balance_minor = 650_000_000  # PKR 6,500,000 on 1 Jul 2024

# Bank holidays: no settlements or transfers. ASSUMPTION: lunar-calendar dates are approximate.
[calendar]
bank_holidays = [
  "2024-07-01", "2024-07-16", "2024-07-17", "2024-08-14", "2024-09-17", "2024-11-09", "2024-12-25",
  "2025-02-05", "2025-03-31", "2025-04-01", "2025-04-02", "2025-05-01", "2025-05-28", "2025-06-06",
  "2025-06-07", "2025-06-09", "2025-07-01", "2025-07-05", "2025-07-06", "2025-08-14", "2025-09-05",
  "2025-11-09", "2025-12-25", "2026-02-05", "2026-03-20", "2026-03-23", "2026-05-01", "2026-05-27",
  "2026-05-28", "2026-05-29", "2026-06-25", "2026-06-26", "2026-07-01", "2026-08-14", "2026-08-26",
  "2026-11-09", "2026-12-25", "2027-01-01",
]
# Store traffic (receipts) in percent of normal; `categories` also shifts the product mix.
seasons = [
  { name = "Independence Day sale 2024", start = "2024-08-08", end = "2024-08-14", traffic_pct = 130 },
  { name = "Wedding season 2024-25", start = "2024-11-15", end = "2025-01-31", traffic_pct = 115, categories = ["STS", "UNS"], mix_pct = 140 },
  { name = "Ramadan and Eid shopping 2025", start = "2025-03-01", end = "2025-03-30", traffic_pct = 175 },
  { name = "Eid al-Fitr holidays 2025", start = "2025-03-31", end = "2025-04-02", traffic_pct = 45 },
  { name = "Eid al-Adha 2025", start = "2025-05-30", end = "2025-06-06", traffic_pct = 135 },
  { name = "Eid al-Adha holidays 2025", start = "2025-06-07", end = "2025-06-09", traffic_pct = 50 },
  { name = "Independence Day sale 2025", start = "2025-08-08", end = "2025-08-14", traffic_pct = 130 },
  { name = "Wedding season 2025-26", start = "2025-11-15", end = "2026-01-31", traffic_pct = 115, categories = ["STS", "UNS"], mix_pct = 140 },
  { name = "Ramadan and Eid shopping 2026", start = "2026-02-18", end = "2026-03-19", traffic_pct = 175 },
  { name = "Eid al-Fitr holidays 2026", start = "2026-03-20", end = "2026-03-22", traffic_pct = 45 },
  { name = "Eid al-Adha 2026", start = "2026-05-19", end = "2026-05-26", traffic_pct = 135 },
  { name = "Eid al-Adha holidays 2026", start = "2026-05-27", end = "2026-05-29", traffic_pct = 50 },
  { name = "Independence Day sale 2026", start = "2026-08-08", end = "2026-08-14", traffic_pct = 130 },
  { name = "Wedding season 2026-27", start = "2026-11-15", end = "2027-01-31", traffic_pct = 115, categories = ["STS", "UNS"], mix_pct = 140 },
]
traffic_growth_pct_per_year = 14  # store traffic grows year on year, applied smoothly

[inflation]
purchase_cost_ppm_per_month = 12_000  # ASSUMPTION: supplier prices rise about 1.2 % a month
retail_price_step_pct = 6  # shelf prices rise 6 % on 1 January and 1 July
retail_price_step_months = [1, 7]

