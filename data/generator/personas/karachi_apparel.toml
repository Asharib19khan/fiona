# Persona: Karachi apparel retailer. SYNTHETIC: every name, number and account is invented.
#
# DRAFT    = a policy value that belongs to Abdullah's rulebook; replace it when B1/B2 land.
# ASSUMPTION = a fact we chose because no source document fixes it (listed in FORMATS.md).

[tenant]
id = "ten_karachi_apparel"
name = "Karachi Apparel Co. (synthetic)"
country = "PK"
currency = "PKR"
minor_unit = 2
framework = "IFRS_SMES"
fiscal_year_start_month = 7  # ASSUMPTION: Pakistan's tax year starts on 1 July
timezone = "Asia/Karachi"
utc_offset_hours = 5
as_of = "2026-10-22"  # ASSUMPTION: demo "as of" date used by the Blueprint examples

[policies]
cash_buffer_minor = 200_000_000  # DRAFT: PKR 2,000,000 owner buffer

[country_pack_draft]
gst_rate_bp = 1800  # ASSUMPTION: 18 % standard sales tax on goods
prices_include_gst = true  # ASSUMPTION: shelf prices include GST
tax_id_type = "NTN"
tax_id_pattern = "^[0-9]{7}-[0-9]$"  # ASSUMPTION: NTN as 7 digits, dash, check digit

[bank]
iban_bank_code = "SYNA"  # not a real bank code
name = "Operating account"
opening_balance_minor = 800_000_000  # PKR 8,000,000

[[branches]]
id = "BR01"
name = "Tariq Road"
registers = ["R1", "R2", "R3"]
daily_receipts = 60
card_mid = "448120"
rent_minor = 55_000_000
landlord = "pty_001"

[[branches]]
id = "BR02"
name = "Clifton"
registers = ["R4", "R5"]
daily_receipts = 35
card_mid = "448121"
rent_minor = 38_000_000
landlord = "pty_002"

[pos]
open_minute = 660  # 11:00 local
close_minute = 1290  # 21:30 local
shift_change_minute = 960  # 16:00 local: morning and evening cashier per register
lines_weights = [70, 22, 8]  # receipts with 1, 2, 3 lines
qty_weights = [85, 15]  # 1 or 2 units per line
weekday_pct = [85, 85, 90, 95, 80, 125, 140]  # Mon..Sun; Friday prayers dip, weekend peak
loyalty_customers = 200
loyalty_share_pct = 30
discount_share_pct = 10
discount_bp = 1000
refund_per_mille = 10  # ASSUMPTION: refunds are paid in cash at the till
void_per_mille = 5
opening_float_minor = 1_000_000  # PKR 10,000 per drawer
over_short_share_pct = 15
over_short_range_minor = [-50_000, 30_000]
payment_mix = { cash = 45, card = 20, bank_qr = 10, raast = 10, jazzcash = 8, easypaisa = 7 }
# Settlements arrive gross, batched per branch (wallets for the whole business) on the n-th
# business day after the sale. Fees are debited once a month (ASSUMPTION).
settlement_lag_business_days = { card = 1, bank_qr = 1, raast = 1, jazzcash = 2, easypaisa = 2 }
mdr_bp = { card = 150, bank_qr = 80, raast = 0, jazzcash = 160, easypaisa = 160 }
size_weights = { S = 20, M = 35, L = 30, XL = 15, OS = 100, 4Y = 30, 6Y = 35, 8Y = 35 }
# Demand multiplier (percent) for winter items by month, Jan..Dec.
winter_month_pct = [180, 100, 40, 20, 15, 15, 15, 15, 25, 60, 120, 180]

[purchasing]
order_weekdays = [0, 2, 4]  # Monday, Wednesday, Friday
cover_days = 6  # order up to this many days of demand beyond the lead time
reorder_days = 5  # reorder when stock plus on-order falls below lead time + this many days
pack_size = 6
opening_cover_days = 21

