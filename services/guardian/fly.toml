# Fly.io app for the Guardian. Deploy from the repo root:
#   fly deploy --config services/guardian/fly.toml --dockerfile services/guardian/Dockerfile .
app = "fiona-guardian"
primary_region = "sin"

# Secrets are set with `fly secrets set` (see docs/demo/DEPLOY.md), never here.
[env]
  FIONA_MODE = "live"
  FIONA_LLM_PROVIDER = "claude_cli"
  ENGINE_BASE_URL = "https://fiona-engine.fly.dev"

[http_service]
  internal_port = 8200
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # demo: no cold starts

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
