[project]
name = "fiona-guardian"
version = "0.1.0"
description = "Fiona Guardian: independent adversarial review and the verdict combiner."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "httpx>=0.28.1",
  "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
